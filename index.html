<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teach · Seguimiento docente</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;color:#17191C;background:#F3F1EA;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid #7B6CF6;outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:#15171B;padding:24px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;font:700 18px 'Space Grotesk',sans-serif;color:#fff}
.logo{width:32px;height:32px;border-radius:10px;background:#C6F432;color:#15171B;display:grid;place-items:center}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;gap:12px;align-items:center;padding:0 12px;min-height:44px;border-radius:10px;color:#B9BBC0;background:none;border:0;font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.nav button.on{background:#262A31;color:#fff}
.side .out{margin-top:auto;background:#1E2126;border:0;color:#B9BBC0;border-radius:12px;min-height:44px;font-size:13px;cursor:pointer}
.main{padding:28px 36px 40px;display:flex;flex-direction:column;gap:22px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font:700 30px 'Space Grotesk',sans-serif;letter-spacing:-.02em}
h2{margin:0;font:700 20px 'Space Grotesk',sans-serif}
.sub{color:#5B6068;font-size:14px;margin-top:4px}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input,textarea{min-height:44px;border:1px solid #D9D5C8;border-radius:12px;background:#fff;padding:0 14px;font-size:16px;color:#17191C;width:100%}
textarea{padding:12px 14px;min-height:88px;resize:vertical}
.acts select{width:auto;max-width:260px;font-weight:500}
.btn{background:#15171B;color:#fff;border:0;border-radius:12px;min-height:44px;padding:0 18px;font:600 14px Inter,sans-serif;cursor:pointer}
.btn.sec{background:#fff;color:#15171B;border:1.5px solid #15171B}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#fff;border:1px solid #E7E4DA;border-radius:18px;padding:18px}
.kpi small{color:#5B6068;font-size:13px;font-weight:500}
.kpi strong{display:block;font:700 34px 'Space Grotesk',sans-serif;letter-spacing:-.03em;margin:6px 0 10px}
.bar{height:6px;border-radius:6px;background:#ECE9DF;overflow:hidden}
.bar i{display:block;height:100%;background:#15171B;border-radius:6px}
.kpi.hl{background:#15171B;border-color:#15171B}
.kpi.hl small{color:#B9BBC0}.kpi.hl strong{color:#C6F432}.kpi.hl .bar{background:#34383F}.kpi.hl .bar i{background:#C6F432}
.note{font-size:12px;color:#5B6068}
.tabs{display:none}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.col{background:rgba(23,25,28,.045);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.ch{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 6px}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:5px 11px}
.t1{background:#E4E1FF;color:#2E2799}.t2{background:#FFE5BD;color:#6E3B00}.t3{background:#D2EAFF;color:#0B4A7D}.t4{background:#C6F432;color:#1E2A00}
.cnt{font-size:13px;color:#5B6068;font-weight:600}
.card{background:#fff;border:1px solid #E7E4DA;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:15px;font-weight:600}
.meta{color:#5B6068;font-size:13px}
.tool{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:600;background:#F3F1EA;border-radius:8px;padding:4px 9px}
.warn{color:#8A3B00;font-weight:600;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.go{background:#fff;border:1.5px solid #15171B;color:#15171B;border-radius:10px;min-height:44px;font:600 13px Inter,sans-serif;padding:0 12px;cursor:pointer;flex:1}
.go.pri{background:#15171B;color:#fff}
.empty{color:#5B6068;font-size:13px;padding:10px 4px}
.panel{background:#fff;border:1px solid #E7E4DA;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ev{display:grid;grid-template-columns:150px 150px 1fr;gap:12px;padding:12px 0;border-top:1px solid #EFECE2;font-size:14px}
.ev:first-child{border-top:0}
.ev time{color:#5B6068;font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:#F3F1EA}
.filters{display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
dialog{border:0;border-radius:22px;padding:0;width:min(520px,calc(100vw - 24px));max-height:92vh;color:#17191C}
dialog::backdrop{background:rgba(21,23,27,.55)}
dialog form{padding:22px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3A3F46}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fa{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.fa .btn{flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#15171B;color:#fff;border-radius:12px;padding:12px 18px;font-size:14px;z-index:50;max-width:90vw}
.toast.err{background:#9B2C1B;color:#fff}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{background:#fff;border:1px solid #E7E4DA;border-radius:24px;padding:32px;width:min(400px,100%);display:flex;flex-direction:column;gap:16px}
.lbox .brand{color:#17191C}
.err{color:#9B2C1B;font-size:13px;min-height:18px}
.banner{background:#FFE9E3;border:1px solid #E9B7AA;color:#7A2415;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;word-break:break-word}
.banner .go{flex:0 0 auto;min-width:110px}
.banner.info{background:#FFF4D6;border-color:#EBD38A;color:#5E4300}
.onb{background:#15171B;color:#fff;border-radius:20px;padding:22px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.onb h2{color:#fff}.onb p{margin:6px 0 0;color:#B9BBC0;font-size:14px}
.onb .btn{background:#C6F432;color:#15171B}
.bn,.fab{display:none}
@media (max-width:900px){
 .app{grid-template-columns:1fr}.side{display:none}
 .main{padding:18px 16px 150px}
 h1{font-size:26px}
 .acts{width:100%}.acts select{flex:1;max-width:none}.acts .btn.new{display:none}
 .kpis{display:flex;overflow-x:auto;gap:10px}.kpi{flex:0 0 150px;padding:14px}.kpi strong{font-size:26px}
 .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(23,25,28,.07);border-radius:14px;padding:4px}
 .tabs button{border:0;background:transparent;min-height:46px;border-radius:11px;font:600 12px Inter,sans-serif;color:#4A4F57;display:flex;flex-direction:column;align-items:center;justify-content:center}
 .tabs button.on{background:#fff;color:#17191C;box-shadow:0 1px 3px rgba(0,0,0,.12)}
 .tabs span{font-size:11px;font-weight:500}
 .board{grid-template-columns:1fr}
 .col{display:none;background:none;padding:0}.col.on{display:flex}.col .ch{display:none}
 .ev{grid-template-columns:1fr;gap:4px}
 .filters{grid-template-columns:1fr 1fr}
 .bn{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;background:#15171B;padding:8px 8px calc(14px + env(safe-area-inset-bottom,0px));z-index:20}
 .bn button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:48px;color:#B9BBC0;font-size:11px;font-weight:500}
 .bn button.on{color:#C6F432}
 .fab{display:grid;position:fixed;right:18px;bottom:calc(90px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:#C6F432;color:#15171B;border:0;place-items:center;box-shadow:0 8px 20px rgba(21,23,27,.28);z-index:21}
 .two{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="login" hidden>
 <form class="lbox" id="lform">
  <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg></span>Teach</div>
  <div><h2>Seguimiento docente</h2><div class="sub">Entra con tu correo y contraseña.</div></div>
  <label>Correo<input type="email" name="email" autocomplete="username" required></label>
  <label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label>
  <div class="err" id="lerr" role="alert"></div>
  <button class="btn" type="submit">Entrar</button>
 </form>
</div>

<div class="app" id="app" hidden>
 <aside class="side">
  <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg></span>Teach</div>
  <nav class="nav" aria-label="Principal">
   <button data-view="tablero"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="5" height="18" rx="1.5"/><rect x="10" y="3" width="5" height="12" rx="1.5"/><rect x="17" y="3" width="4" height="8" rx="1.5"/></svg>Tablero</button>
   <button data-view="bitacora"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Bitácora</button>
   <button data-view="colegios"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 21h18M5 21V9l7-5 7 5v12M10 21v-6h4v6"/></svg>Colegios</button>
  </nav>
  <button class="out" id="logout">Cerrar sesión</button>
 </aside>

 <main class="main">
  <div class="top">
   <div><h1 id="title">Tablero de avance</h1><div class="sub" id="subtitle"></div></div>
   <div class="acts">
    <select id="colsel" aria-label="Colegio"></select>
    <button class="btn new" id="newdiag">+ Nuevo diagnóstico</button>
   </div>
  </div>

  <div id="banner" class="banner" role="alert" hidden></div>
  <section id="v-tablero" hidden>
   <div style="display:flex;flex-direction:column;gap:22px">
    <div id="onb"></div>
    <div class="kpis" id="kpis"></div>
    <div class="tabs" id="tabs"></div>
    <div class="board" id="board"></div>
   </div>
  </section>

  <section id="v-bitacora" hidden>
   <div class="panel">
    <div class="filters">
     <input id="fq" type="search" placeholder="Buscar docente o texto" aria-label="Buscar">
     <select id="ft" aria-label="Tipo de evento"></select>
     <button class="btn sec" id="finc">+ Incidencia</button>
     <button class="btn" id="fcopy">Copiar historial</button>
    </div>
    <div id="evlist"></div>
   </div>
  </section>

  <section id="v-colegios" hidden>
   <div style="display:flex;flex-direction:column;gap:16px">
    <div><button class="btn" id="newcol">+ Nuevo colegio</button></div>
    <div class="grid2" id="collist"></div>
   </div>
  </section>
 </main>
</div>

<nav class="bn" id="bn" hidden aria-label="Principal">
 <button data-view="tablero"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="5" height="18" rx="1.5"/><rect x="10" y="3" width="5" height="12" rx="1.5"/><rect x="17" y="3" width="4" height="8" rx="1.5"/></svg>Tablero</button>
 <button data-view="bitacora"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Bitácora</button>
 <button data-view="colegios"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 21h18M5 21V9l7-5 7 5v12M10 21v-6h4v6"/></svg>Colegios</button>
</nav>
<button class="fab" id="fab" hidden aria-label="Nuevo diagnóstico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

<!-- Diagnóstico -->
<dialog id="dDiag"><form id="fDiag">
 <h2>Nuevo diagnóstico</h2>
 <label>Docente<input name="nombre" list="dl-docs" required autocomplete="off"><datalist id="dl-docs"></datalist></label>
 <div class="two"><label>Materia<input name="materia"></label><label>Grado<input name="grado" required></label></div>
 <div class="two"><label>Estudiantes presentes<input name="estudiantes" type="number" inputmode="numeric" min="0" required></label>
 <label>¿Usa tecnología hoy?<select name="usa"><option value="no">No</option><option value="si">Sí</option></select></label></div>
 <div class="two"><label>Nivel digital inicial<select name="nivel"><option value="1">1 · Ninguno</option><option value="2">2 · Básico</option><option value="3">3 · Intermedio</option><option value="4">4 · Avanzado</option></select></label>
 <label>Próxima acción<input name="fecha" type="date"></label></div>
 <label>Herramienta acordada<select name="herr" id="herrsel"></select></label>
 <label id="otraw" hidden>Nombre de la herramienta nueva<input name="otra"></label>
 <div class="fa"><button type="button" class="btn sec" data-close>Cancelar</button><button class="btn" type="submit">Guardar diagnóstico</button></div>
</form></dialog>

<!-- Incidencia -->
<dialog id="dInc"><form id="fInc">
 <h2>Nueva incidencia</h2>
 <label>Tipo<select name="tipo"><option value="reunion_directivos">Reunión con directivos</option><option value="falla_electrica">Falla eléctrica</option><option value="internet">Problema de internet</option><option value="suspension_clases">Suspensión de clases</option><option value="otro">Otro</option></select></label>
 <label>Detalle<textarea name="descripcion" required></textarea></label>
 <div class="fa"><button type="button" class="btn sec" data-close>Cancelar</button><button class="btn" type="submit">Guardar incidencia</button></div>
</form></dialog>

<!-- Colegio -->
<dialog id="dCol"><form id="fCol">
 <h2 id="dColT">Nuevo colegio</h2>
 <input type="hidden" name="id">
 <label>Nombre del colegio<input name="nombre" required></label>
 <label>Total de profesores<input name="total" type="number" inputmode="numeric" min="0" required></label>
 <label>Conexión a internet<select name="internet"><option value="estable">Estable</option><option value="intermitente">Intermitente</option><option value="sin_conexion">Sin conexión</option></select></label>
 <label>Uso de herramientas digitales en el plantel<select name="nivel"><option value="parte_de_cero">Parte desde cero</option><option value="usa_herramientas">Ya usa herramientas</option></select></label>
 <div class="fa"><button type="button" class="btn sec" data-close>Cancelar</button><button class="btn" type="submit">Guardar colegio</button></div>
</form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg=window.TEACH_CONFIG||{};
const STAGES=[{k:'diagnostico',n:'1 · Diagnóstico',s:'Diagnóstico',t:'t1'},{k:'asesoria',n:'2 · En asesoría',s:'Asesoría',t:'t2'},{k:'verificar',n:'3 · Por verificar',s:'Verificar',t:'t3'},{k:'logrado',n:'4 · Logrado',s:'Logrado',t:'t4'}];
const TIPOS={diagnostico:'Diagnóstico',asesoria:'Asesoría',verificar:'Verificación',logrado:'Logrado',reunion_directivos:'Reunión con directivos',falla_electrica:'Falla eléctrica',internet:'Problema de internet',suspension_clases:'Suspensión de clases',otro:'Otro'};
const INTERNET={estable:'Internet estable',intermitente:'Internet intermitente',sin_conexion:'Sin conexión'};
const NIVEL={parte_de_cero:'Parte desde cero',usa_herramientas:'Ya usa herramientas'};
const TOOLS=['Kahoot','Google Classroom','Canva','Genially','Google Forms','Padlet'];
const ACT={asesoria:{etapa:'asesoria',estado_asesoria:'en_proceso'},concretar:{etapa:'verificar',estado_asesoria:'concretado'},noconcretado:{estado_asesoria:'no_concretado'},retomar:{estado_asesoria:'en_proceso'},logro:{etapa:'logrado'},refuerzo:{etapa:'asesoria',estado_asesoria:'en_proceso'},recaida:{etapa:'asesoria',estado_asesoria:'en_proceso'}};
const S={colegios:[],col:null,herr:[],docs:[],procs:[],kpi:null,eventos:[],inc:[],stage:'diagnostico',view:'tablero'};
let sb;

function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3500)}
function banner(msg,retry,info){const b=$('#banner');if(!msg){b.hidden=true;b.innerHTML='';return}b.hidden=false;b.className='banner'+(info?' info':'');b.innerHTML='<span>'+esc(msg)+'</span>'+(retry?'<button class="go" id="bretry">Reintentar</button>':'');if(retry)$('#bretry').onclick=()=>{banner();loadAll()}}
function fail(e,m){console.error(e);const d=e&&(e.message||String(e));banner((m||'Ocurrió un error.')+(d?' Detalle: '+d:''),true);toast(m||'Ocurrió un error',true)}
const fmt=d=>new Date(d).toLocaleString('es',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

async function init(){
 if(!cfg.SUPABASE_URL||cfg.SUPABASE_URL.includes('PEGA')){document.body.innerHTML='<p style="padding:24px;font-family:Inter,sans-serif">Falta configurar la conexión. Abre el archivo <b>config.js</b> y pega tu Project URL y tu Publishable key.</p>';return}
 sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY);
 const {data:{session}}=await sb.auth.getSession();
 showAuth(!!session);
 sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT')showAuth(false)});
}
function showAuth(ok){$('#login').hidden=ok;$('#app').hidden=!ok;$('#bn').hidden=!ok;$('#fab').hidden=!ok;if(ok)loadAll()}

$('#lform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);$('#lerr').textContent='';
 const {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});
 if(error)$('#lerr').textContent='Correo o contraseña incorrectos. Revísalos e intenta de nuevo.';else showAuth(true)};
$('#logout').onclick=()=>sb.auth.signOut();

async function loadAll(){
 S.loading=true;render();
 const slow=setTimeout(()=>{if(S.loading)banner('Está tardando más de lo normal. Revisa tu conexión a internet; seguimos intentando.',false,true)},8000);
 try{
  const [c,h]=await Promise.all([sb.from('colegios').select('*').order('nombre'),sb.from('herramientas').select('*').order('nombre')]);
  if(c.error)throw c.error;if(h.error)throw h.error;
  S.colegios=c.data;S.herr=h.data;
  const saved=localStorage.getItem('teach_col');
  S.col=(S.colegios.find(x=>x.id===saved)||S.colegios[0]||{}).id||null;
  await loadCol();
  banner();
  if(!S.herr.length)seedTools();
 }catch(e){fail(e,'No se pudieron cargar los datos.')}
 finally{clearTimeout(slow);S.loading=false;render()}
}
async function seedTools(){
 const i=await sb.from('herramientas').insert(TOOLS.map(nombre=>({nombre})));
 if(i.error){console.error(i.error);return}
 const h=await sb.from('herramientas').select('*').order('nombre');S.herr=h.data||[];
}
async function loadCol(){
 S.docs=[];S.procs=[];S.kpi=null;S.eventos=[];S.inc=[];
 if(S.col){
  localStorage.setItem('teach_col',S.col);
  const [d,p,k,ev,ic]=await Promise.all([
   sb.from('docentes').select('*').eq('colegio_id',S.col).order('nombre'),
   sb.from('procesos').select('*, docentes!inner(colegio_id)').eq('docentes.colegio_id',S.col),
   sb.from('kpis_colegio').select('*').eq('colegio_id',S.col).maybeSingle(),
   sb.from('eventos').select('*').eq('colegio_id',S.col).order('fecha',{ascending:false}).limit(300),
   sb.from('incidencias').select('*').eq('colegio_id',S.col).order('fecha',{ascending:false}).limit(200)]);
  for(const r of [d,p,ev,ic])if(r.error)throw r.error;
  S.docs=d.data;S.procs=p.data;S.kpi=k.data;S.eventos=ev.data;S.inc=ic.data;
 }
 render();
}

function render(){
 const sel=$('#colsel');
 sel.innerHTML=S.loading?'<option>Cargando…</option>':S.colegios.length?S.colegios.map(c=>`<option value="${c.id}"${c.id===S.col?' selected':''}>${esc(c.nombre)}</option>`).join(''):'<option>Sin colegios</option>';
 const titles={tablero:'Tablero de avance',bitacora:'Bitácora de campo',colegios:'Colegios'};
 $('#title').textContent=titles[S.view];
 const c=S.colegios.find(x=>x.id===S.col);
 $('#subtitle').textContent=S.loading?'Cargando datos…':c?`${c.nombre} · ${INTERNET[c.internet]||''}`:'Crea tu primer colegio para empezar';
 $('#newdiag').hidden=S.view!=='tablero';$('#fab').hidden=S.view!=='tablero';
 ['tablero','bitacora','colegios'].forEach(v=>$('#v-'+v).hidden=S.view!==v);
 $$('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));
 if(S.view==='tablero')renderBoard();if(S.view==='bitacora')renderBitacora();if(S.view==='colegios')renderColegios();
}
function pct(v){return v==null?'—':Math.round(v)+'%'}
function renderBoard(){
 $('#onb').innerHTML=(!S.col&&!S.loading)?'<div class="onb"><div><h2>Empecemos por tu primer colegio</h2><p>Registra su ficha una sola vez y luego podrás hacer diagnósticos.</p></div><button class="btn" data-newcol>Crear mi primer colegio</button></div>':'';
 const k=S.kpi||{};
 const kp=(l,v,w,hl)=>`<div class="kpi${hl?' hl':''}"><small>${l}</small><strong>${v}</strong><div class="bar"><i style="width:${w||0}%"></i></div></div>`;
 $('#kpis').innerHTML=kp('Cobertura docente',pct(k.cobertura_pct),k.cobertura_pct,1)+kp('Efectividad de capacitación',pct(k.efectividad_pct),k.efectividad_pct)+kp('Aplicación en aula',pct(k.aplicacion_pct),k.aplicacion_pct)+
  `<div class="kpi"><small>Alcance estudiantil</small><strong>${k.alcance_estudiantes??0}</strong><div class="note">alumnos con docentes en Logrado</div></div>`;
 $('#tabs').innerHTML=STAGES.map(s=>`<button data-stage="${s.k}" class="${S.stage===s.k?'on':''}">${s.s}<span>${S.procs.filter(p=>p.etapa===s.k).length}</span></button>`).join('');
 $('#board').innerHTML=STAGES.map(s=>{const ps=S.procs.filter(p=>p.etapa===s.k).sort((a,b)=>new Date(a.updated_at)-new Date(b.updated_at));
  return `<div class="col${S.stage===s.k?' on':''}"><div class="ch"><span class="tag ${s.t}">${s.n}</span><span class="cnt">${ps.length}</span></div>${ps.map(card).join('')||`<p class="empty">${S.loading?'Cargando…':'Sin tarjetas en esta etapa.'}</p>`}</div>`}).join('');
}
function card(p){
 const d=S.docs.find(x=>x.id===p.docente_id)||{};const h=S.herr.find(x=>x.id===p.herramienta_id);
 const days=Math.floor((Date.now()-new Date(p.updated_at))/864e5);
 const stuck=p.etapa==='asesoria'&&days>15;
 let info=`${days} día${days===1?'':'s'} en esta etapa`;
 if(p.etapa==='asesoria'&&p.estado_asesoria==='no_concretado')info='No concretado';
 if(p.etapa==='logrado')info=`+${p.estudiantes||0} alumnos al impacto`;
 if(p.proxima_accion&&p.etapa!=='logrado')info+=` · próxima: ${new Date(p.proxima_accion+'T00:00').toLocaleDateString('es',{day:'numeric',month:'short'})}`;
 const b=(a,t,pri)=>`<button class="go${pri?' pri':''}" data-act="${a}" data-id="${p.id}">${t}</button>`;
 let acts='';
 if(p.etapa==='diagnostico')acts=b('asesoria','Pasar a asesoría',1);
 if(p.etapa==='asesoria')acts=p.estado_asesoria==='no_concretado'?b('retomar','Retomar asesoría',1):b('concretar','Marcar concretado',1)+b('noconcretado','No concretado');
 if(p.etapa==='verificar')acts=b('logro','Sí lo aplicó',1)+b('refuerzo','Aún no');
 if(p.etapa==='logrado')acts=b('recaida','Recaída');
 return `<div class="card"><h3>${esc(d.nombre)}</h3><div class="meta">${esc(d.materia||'')}${d.materia&&p.grado?' · ':''}${esc(p.grado||'')}${p.estudiantes!=null?' · '+p.estudiantes+' alumnos':''}</div>${h?`<span class="tool">${esc(h.nombre)}</span>`:''}<div class="${stuck?'warn':'meta'}">${stuck?days+' días estancado':esc(info)}</div><div class="row">${acts}</div></div>`;
}
document.addEventListener('click',async e=>{
 const st=e.target.closest('[data-stage]');if(st){S.stage=st.dataset.stage;renderBoard();return}
 const vw=e.target.closest('[data-view]');if(vw){S.view=vw.dataset.view;render();window.scrollTo(0,0);return}
 const a=e.target.closest('[data-act]');
 if(a){a.disabled=true;const {error}=await sb.from('procesos').update(ACT[a.dataset.act]).eq('id',a.dataset.id);
  if(error){fail(error);a.disabled=false;return}
  const next=ACT[a.dataset.act].etapa;if(next)S.stage=next;
  try{await loadCol();toast('Cambio guardado')}catch(x){fail(x)}return}
 const nc=e.target.closest('[data-newcol]');if(nc){openCol(null);return}
 const cl=e.target.closest('[data-close]');if(cl){cl.closest('dialog').close();return}
 const sc=e.target.closest('[data-selcol]');if(sc){S.col=sc.dataset.selcol;S.view='tablero';try{await loadCol()}catch(x){fail(x)}return}
 const ec=e.target.closest('[data-editcol]');if(ec){openCol(S.colegios.find(c=>c.id===ec.dataset.editcol))}
});
$('#colsel').onchange=async e=>{S.col=e.target.value;try{await loadCol()}catch(x){fail(x)}};

/* Diagnóstico */
function openDiag(){
 if(!S.col){toast('Primero crea un colegio.',true);S.view='colegios';render();openCol(null);return}
 const f=$('#fDiag');f.reset();
 $('#dl-docs').innerHTML=S.docs.map(d=>`<option value="${esc(d.nombre)}">`).join('');
 $('#herrsel').innerHTML=S.herr.map(h=>`<option value="${h.id}">${esc(h.nombre)}</option>`).join('')+'<option value="__nueva">Otra (escribirla)…</option>';
 $('#otraw').hidden=true;$('#dDiag').showModal();
}
$('#newdiag').onclick=openDiag;$('#fab').onclick=openDiag;
$('#herrsel').onchange=e=>{$('#otraw').hidden=e.target.value!=='__nueva'};
$('#fDiag').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const btn=e.submitter;btn.disabled=true;
 try{
  const nombre=f.get('nombre').trim();
  let d=S.docs.find(x=>x.nombre.toLowerCase()===nombre.toLowerCase());
  if(!d){const r=await sb.from('docentes').insert({colegio_id:S.col,nombre,materia:f.get('materia').trim()||null}).select().single();if(r.error)throw r.error;d=r.data}
  let hid=f.get('herr');
  if(hid==='__nueva'){const n=f.get('otra').trim();if(!n)throw new Error('Escribe el nombre de la herramienta.');const r=await sb.from('herramientas').insert({nombre:n}).select().single();if(r.error)throw r.error;hid=r.data.id;S.herr.push(r.data)}
  const p=await sb.from('procesos').insert({docente_id:d.id,herramienta_id:hid,grado:f.get('grado').trim(),estudiantes:+f.get('estudiantes'),usa_tecnologia:f.get('usa')==='si',nivel_digital_inicial:+f.get('nivel'),proxima_accion:f.get('fecha')||null});
  if(p.error)throw p.error;
  $('#dDiag').close();S.stage='diagnostico';await loadCol();toast('Diagnóstico guardado');
 }catch(x){fail(x)}finally{btn.disabled=false}};

/* Bitácora */
function renderBitacora(){
 const ft=$('#ft');if(!ft.options.length){ft.innerHTML='<option value="">Todos los eventos</option>'+Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
 const items=[...S.eventos.map(e=>({fecha:e.fecha,tipo:e.tipo,detalle:e.detalle||''})),...S.inc.map(i=>({fecha:i.fecha,tipo:i.tipo,detalle:i.descripcion||''}))].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
 const q=$('#fq').value.trim().toLowerCase(),t=ft.value;
 S.filtered=items.filter(i=>(!t||i.tipo===t)&&(!q||i.detalle.toLowerCase().includes(q)));
 $('#evlist').innerHTML=S.filtered.map(i=>`<div class="ev"><time>${fmt(i.fecha)}</time><div><span class="pill">${esc(TIPOS[i.tipo]||i.tipo)}</span></div><div>${esc(i.detalle)}</div></div>`).join('')||'<p class="empty">Aún no hay eventos. Se llenará solo cuando muevas tarjetas en el tablero.</p>';
}
$('#fq').oninput=renderBitacora;$('#ft').onchange=renderBitacora;
$('#fcopy').onclick=async()=>{const c=S.colegios.find(x=>x.id===S.col);const txt=(c?c.nombre+'\n':'')+(S.filtered||[]).map(i=>`${fmt(i.fecha)} | ${TIPOS[i.tipo]||i.tipo} | ${i.detalle}`).join('\n');
 try{await navigator.clipboard.writeText(txt);toast('Historial copiado')}catch(x){fail(x,'No se pudo copiar. Selecciona el texto manualmente.')}};
$('#finc').onclick=()=>{$('#fInc').reset();$('#dInc').showModal()};
$('#fInc').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);e.submitter.disabled=true;
 const {error}=await sb.from('incidencias').insert({colegio_id:S.col,tipo:f.get('tipo'),descripcion:f.get('descripcion').trim()});
 e.submitter.disabled=false;if(error){fail(error);return}
 $('#dInc').close();try{await loadCol();toast('Incidencia guardada')}catch(x){fail(x)}};

/* Colegios */
function renderColegios(){
 $('#collist').innerHTML=S.colegios.map(c=>`<div class="card"><h3>${esc(c.nombre)}</h3><div class="meta">${c.total_docentes??'?'} profesores</div><div class="row"><span class="tool">${esc(INTERNET[c.internet]||'')}</span><span class="tool">${esc(NIVEL[c.nivel_digital]||'')}</span></div><div class="row"><button class="go pri" data-selcol="${c.id}">Abrir tablero</button><button class="go" data-editcol="${c.id}">Editar</button></div></div>`).join('')||'<p class="empty">Todavía no hay colegios. Pulsa «Nuevo colegio».</p>';
}
function openCol(c){
 const f=$('#fCol');f.reset();$('#dColT').textContent=c?'Editar colegio':'Nuevo colegio';
 f.id.value=c?c.id:'';if(c){f.nombre.value=c.nombre;f.total.value=c.total_docentes??'';f.internet.value=c.internet||'estable';f.nivel.value=c.nivel_digital||'parte_de_cero'}
 $('#dCol').showModal();
}
$('#newcol').onclick=()=>openCol(null);
$('#fCol').onsubmit=async e=>{e.preventDefault();const f=e.target;e.submitter.disabled=true;
 const row={nombre:f.nombre.value.trim(),total_docentes:+f.total.value,internet:f.internet.value,nivel_digital:f.nivel.value};
 const r=f.id.value?await sb.from('colegios').update(row).eq('id',f.id.value).select().single():await sb.from('colegios').insert(row).select().single();
 e.submitter.disabled=false;if(r.error){fail(r.error);return}
 $('#dCol').close();
 try{const c=await sb.from('colegios').select('*').order('nombre');S.colegios=c.data;S.col=r.data.id;S.view='tablero';await loadCol();toast('Colegio guardado')}catch(x){fail(x)}};

init();
</script>
</body>
</html>
